name: 예약 알림 보내기
# 예약해 둔 콘티 알림 중 시간이 된 것을 보내요 (5분마다 · GitHub 사정으로 몇 분 늦을 수 있어요)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS -m 60 -X POST https://kkumjari-worship.vercel.app/api/push-due
